{% set name = "ropwr" %}
{% set version = "1.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: af0d8b7d6df279ce180f409660216ee3dd228f86a2127a1d9e7aa8f44adac8a2

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - cvxpy >=1.6
    - numpy >=1.16
    - scikit-learn >=1.6.0
    - scipy >=1.6.1

test:
  imports:
    - ropwr
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/guillermo-navas-palencia/ropwr
  summary: RoPWR is a Python library for robust piecewise regression.
  description: |
    RoPWR implements mathematical programming formulations to compute
    optimal continuous and discontinuous piecewise polynomial regression
    given a list of split points.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/guillermo-navas-palencia/ropwr
  doc_url: https://gnpalencia.org/ropwr

extra:
  recipe-maintainers:
    - Jrice1317
